name: Refresh KRX foreign-ownership snapshots

on:
  # 18:30 KST Mon-Fri = 09:30 UTC. Runs after KRX close (15:30 KST) and after KRX
  # publishes end-of-day foreign-investor data.
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: krx-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: claude/korean-stock-tracker-09X1u
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh snapshots
        run: python -m kstock.refresh -v

      - name: Commit updated snapshot DB
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kstock.db
          if git diff --cached --quiet; then
            echo "No DB changes — nothing to commit."
            exit 0
          fi
          git commit -m "data: refresh KRX foreign-ownership snapshots ($(date -u +%Y-%m-%d))"
          git push origin HEAD:claude/korean-stock-tracker-09X1u
